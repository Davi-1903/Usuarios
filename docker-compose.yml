services:
    nginx:
        build: ./client
        ports:
            - '3000:80'
        depends_on:
            - server

    server:
        build: ./server
        environment:
            - SECRET_KEY=${SECRET_KEY}
            - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
            - TOKEN_EXPIRE_MINUTES=${TOKEN_EXPIRE_MINUTES}
            - ALGORITHM=${ALGORITHM}

            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_NAME=${DB_NAME}
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_DRIVER=${DB_DRIVER}
        depends_on:
            - mysql

    mysql:
        image: mysql:8
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: true
            MYSQL_DATABASE: db_users
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db_data:
